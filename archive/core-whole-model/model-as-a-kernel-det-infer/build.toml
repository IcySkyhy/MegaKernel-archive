[general]
name = "det-infer"
version = 1
edition = 5
license = "Apache-2.0"
backends = [
  "cuda",
]

[general.hub]
repo-id = "phanerozoic/det-infer"

[torch]
src = [
  "torch-ext/torch_binding.cpp",
  "torch-ext/torch_binding.h",
]

[kernel.det-infer]
backend = "cuda"
cuda-capabilities = ["8.0", "8.6", "8.9", "9.0", "10.0", "12.0"]
depends = ["torch"]
src = [
  "di_cuda/megakernel.cu",
  "di_cuda/det_math.cuh",
  "di_cuda/mak_kernels.h",
]
