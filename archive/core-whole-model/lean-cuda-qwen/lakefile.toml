name = "lean-cuda-qwen"
version = "0.1.0"
description = "Qwen inference and training kernels for the experimental Lean CUDA backend"
license = "Apache-2.0"
defaultTargets = ["LeanCudaQwen"]

[[require]]
name = "LeanTest"
