[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "onelaunch"
version = "0.1.0"
description = "A from-scratch fused decode megakernel for batch-1 LLM inference (dense + MoE + tensor-parallel)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "triton",
    "transformers",
    "accelerate",
    "safetensors",
]

[project.optional-dependencies]
plot = ["matplotlib"]
vllm = ["vllm==0.11.0"]

[tool.setuptools.packages.find]
where = ["src"]
