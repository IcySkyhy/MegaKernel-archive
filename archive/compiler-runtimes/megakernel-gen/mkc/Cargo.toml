[package]
name = "mkc"
version = "0.1.0"
edition = "2021"
description = "megakernel compiler: HuggingFace model spec -> single-launch persistent CUDA kernel"

[[bin]]
name = "mkc"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 2
panic = "abort"
